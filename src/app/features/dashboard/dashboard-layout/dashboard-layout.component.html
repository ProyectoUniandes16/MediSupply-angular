<mat-sidenav-container class="sidenav-container">
  <!-- Navegación Lateral -->
  <mat-sidenav 
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    [class.collapsed]="isCollapsed && !isMobile"
    [style.width]="!isMobile ? (isCollapsed ? '64px' : '260px') : '260px'"
    class="sidenav">
    
    <!-- Logo/Nombre -->
    <div class="sidenav-header">
      <h2 class="app-name" *ngIf="!isCollapsed || isMobile">MedySupply</h2>
      <h2 class="app-name-short" *ngIf="isCollapsed && !isMobile">MS</h2>
    </div>

    <!-- Lista de Navegación -->
    <mat-nav-list>
      <mat-list-item 
        *ngFor="let item of navigationItems"
        [class.active]="isActiveRoute(item.route)"
        (click)="navigate(item.route)">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle *ngIf="!isCollapsed || isMobile">{{ item.translationKey | translate }}</span>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido Principal -->
  <mat-sidenav-content>
    <!-- Barra Superior -->
    <mat-toolbar class="toolbar">
      <!-- Botón Menu -->
      <button 
        mat-icon-button 
        (click)="toggleSidenav()"
        [attr.aria-label]="'Alternar menú'">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Título/Breadcrumb -->
      <span class="toolbar-title">{{ currentRoute }}</span>

      <span class="spacer"></span>

      <!-- Iconos de Acción -->
      <!-- Selector de Idioma -->
      <button 
        mat-icon-button
        [matMenuTriggerFor]="languageMenu"
        [attr.aria-label]="'Cambiar idioma'">
        <mat-icon>language</mat-icon>
      </button>

      <mat-menu #languageMenu="matMenu">
        <button mat-menu-item (click)="changeLanguage('es')">
          <mat-icon [color]="currentLanguage === 'es' ? 'primary' : ''">
            {{ currentLanguage === 'es' ? 'check_circle' : 'radio_button_unchecked' }}
          </mat-icon>
          <span>Español</span>
        </button>
        <button mat-menu-item (click)="changeLanguage('en')">
          <mat-icon [color]="currentLanguage === 'en' ? 'primary' : ''">
            {{ currentLanguage === 'en' ? 'check_circle' : 'radio_button_unchecked' }}
          </mat-icon>
          <span>English</span>
        </button>
      </mat-menu>
      
      <button 
        mat-icon-button
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'Perfil de usuario'">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="menu-header">{{ 'DASHBOARD.WELCOME' | translate }}</div>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>{{ 'DASHBOARD.MENU.PROFILE' | translate }}</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>{{ 'DASHBOARD.MENU.SETTINGS' | translate }}</span>
        </button>
      </mat-menu>

      <!-- Botón Salir -->
      <button 
        mat-flat-button 
        color="primary"
        class="logout-button"
        (click)="logout()">
        {{ 'DASHBOARD.LOGOUT' | translate }}
      </button>
    </mat-toolbar>

    <!-- Área de Contenido -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
