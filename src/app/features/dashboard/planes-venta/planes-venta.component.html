<div class="page-container">
  <!-- Encabezado -->
  <div class="page-header">
    <div class="header-content">
      <h1>{{ 'PLANES_VENTA.TITLE' | translate }}</h1>
      <p class="subtitle">{{ 'PLANES_VENTA.SUBTITLE' | translate }}</p>
    </div>
    <div class="header-actions">
      <button 
        mat-raised-button 
        color="primary"
        (click)="openAgregarPlanDialog()">
        <mat-icon>add</mat-icon>
        {{ 'PLANES_VENTA.NEW' | translate }}
      </button>
    </div>
  </div>

  <!-- Estado Vacío -->
  <div class="empty-state">
    <mat-icon class="empty-icon">description</mat-icon>
    <h2>{{ 'PLANES_VENTA.LIST_EMPTY' | translate }}</h2>
  </div>
</div>
