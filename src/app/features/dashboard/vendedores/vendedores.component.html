<div class="vendedores-container">
  <!-- Encabezado -->
  <div class="header">
    <div class="header-info">
      <h1 class="title">{{ 'VENDEDORES.TITLE' | translate }}</h1>
      <p class="subtitle">{{ 'VENDEDORES.SUBTITLE' | translate }}</p>
    </div>
    <button 
      mat-raised-button 
      color="primary"
      class="register-button"
      (click)="openRegistrarVendedorDialog()">
      <mat-icon>add</mat-icon>
      {{ 'VENDEDORES.NEW' | translate }}
    </button>
  </div>

  <!-- Mensaje inicial -->
  <div class="empty-state">
    <p>{{ 'VENDEDORES.LIST_EMPTY' | translate }}</p>
  </div>
</div>
