<div class="productos-container">
  <!-- Encabezado -->
  <div class="header">
    <div class="header-info">
      <h1 class="title">Productos</h1>
      <p class="subtitle">Gestiona productos del inventario</p>
    </div>
    <div class="header-actions">
      <button 
        mat-raised-button 
        color="accent"
        class="bulk-upload-button"
        (click)="openCargaMasivaDialog()">
        <mat-icon>upload</mat-icon>
        Carga Masiva
      </button>
      <button 
        mat-raised-button 
        color="primary"
        class="register-button"
        (click)="openRegistrarProductoDialog()">
        <mat-icon>add</mat-icon>
        Registrar Producto
      </button>
    </div>
  </div>

  <!-- Mensaje inicial -->
  <div class="empty-state">
    <p>Haz clic en "Registrar Producto" para agregar un nuevo producto al inventario.</p>
  </div>
</div>
