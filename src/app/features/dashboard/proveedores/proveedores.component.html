<div class="proveedores-container">
  <!-- Encabezado -->
  <div class="header">
    <div class="header-info">
      <h1 class="title">Proveedores</h1>
      <p class="subtitle">Gestiona proveedores que suministran productos a la compañía</p>
    </div>
    <button 
      mat-raised-button 
      color="primary"
      class="register-button"
      (click)="openRegistrarProveedorDialog()">
      <mat-icon>add</mat-icon>
      Registrar Proveedor
    </button>
  </div>

  <!-- Barra de Filtros -->
  <div class="filters-bar" *ngIf="proveedores.length > 0">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por nombre</mat-label>
      <input 
        matInput 
        [(ngModel)]="searchTerm"
        placeholder="Buscar proveedor">
      <button 
        mat-icon-button 
        matSuffix
        *ngIf="searchTerm"
        (click)="limpiarBusqueda()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" class="estado-field">
      <mat-label>Seleccione Estado</mat-label>
      <mat-select [(ngModel)]="selectedEstado">
        <mat-option value="">Todos</mat-option>
        <mat-option value="activo">Activo</mat-option>
        <mat-option value="inactivo">Inactivo</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="spacer"></div>


  </div>

  <!-- Tabla de Proveedores -->
  <div class="table-container">
    <table mat-table [dataSource]="proveedores" class="proveedores-table" *ngIf="proveedores.length > 0">
      
      <!-- Columna Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre Proveedor</th>
        <td mat-cell *matCellDef="let proveedor">{{ proveedor.nombre }}</td>
      </ng-container>

      <!-- Columna NIT -->
      <ng-container matColumnDef="nit">
        <th mat-header-cell *matHeaderCellDef>NIT</th>
        <td mat-cell *matCellDef="let proveedor">{{ proveedor.nit }}</td>
      </ng-container>

      <!-- Columna Contacto -->
      <ng-container matColumnDef="contacto">
        <th mat-header-cell *matHeaderCellDef>Contacto</th>
        <td mat-cell *matCellDef="let proveedor">{{ proveedor.contacto }}</td>
      </ng-container>

      <!-- Columna Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let proveedor">{{ proveedor.email }}</td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let proveedor">
          <button 
            mat-icon-button 
            (click)="editarProveedor(proveedor)"
            [attr.aria-label]="'Editar proveedor'">
            <mat-icon>edit</mat-icon>
          </button>
          <button 
            mat-icon-button
            [attr.aria-label]="'Más opciones'">
            <mat-icon>more_horiz</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
