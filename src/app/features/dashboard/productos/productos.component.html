<div class="productos-container">
  <!-- Encabezado -->
  <div class="header">
    <div class="header-info">
      <h1 class="title">{{ 'PRODUCTOS.TITLE' | translate }}</h1>
      <p class="subtitle">{{ 'PRODUCTOS.SUBTITLE' | translate }}</p>
    </div>
    <div class="header-actions">
      <button 
        mat-raised-button 
        color="accent"
        class="bulk-upload-button"
        (click)="openCargaMasivaDialog()">
        <mat-icon>upload</mat-icon>
        {{ 'PRODUCTOS.BULK_UPLOAD' | translate }}
      </button>
      <button 
        mat-raised-button 
        color="primary"
        class="register-button"
        (click)="openRegistrarProductoDialog()">
        <mat-icon>add</mat-icon>
        {{ 'PRODUCTOS.NEW' | translate }}
      </button>
    </div>
  </div>

  <!-- Mensaje inicial -->
  <div class="empty-state">
    <p>{{ 'PRODUCTOS.LIST_EMPTY' | translate }}</p>
  </div>
</div>
