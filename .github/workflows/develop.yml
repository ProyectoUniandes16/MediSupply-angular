name: Develop CI/CD

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    name: Angular Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Replace API URL placeholder
        run: |
            echo "Using Production API URL"
            sed -i "s|__API_URL__|${{ secrets.PRODUCTION_API_URL }}|g" src/environments/environment.prod.ts

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build application
        run: npm run build -- --configuration production

      - name: Run tests with coverage
        run: npm test -- --code-coverage --watch=false --browsers=ChromeHeadless

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-artifacts # Nombre del artefacto
          path: ./dist/medysupply-angular/browser/   # Ruta a la carpeta que se va a subir

  deploy:
    # Máquina virtual donde se ejecutará el job
    runs-on: ubuntu-latest
    
    # Nombre del Job
    name: Build and Deploy to AWS

    needs: build-and-test


    # Pasos a seguir
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: angular-build-artifacts # Mismo nombre que en el job de build
          path: ./dist                # Descargar los archivos a una carpeta 'dist'

      # 2. Configurar las credenciales de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Desplegar los archivos compilados a S3
      - name: Deploy static site to S3 bucket
        run: aws s3 sync ./dist// s3://${{ secrets.S3_BUCKET_NAME }} --delete
        # --delete elimina archivos del bucket que ya no existen en la carpeta dist

      # 4. Invalidar la caché de CloudFront
      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"